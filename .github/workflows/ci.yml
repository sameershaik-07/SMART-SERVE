name: SMART-SERVE CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: servicehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Apply Database Migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/servicehub_test?schema=public
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/servicehub_test?schema=public
        run: node prisma/seed.js

      - name: Run Backend Integration Tests
        working-directory: backend
        env:
          PORT: 3105
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/servicehub_test?schema=public
          JWT_SECRET: test_jwt_secret_ci_pipeline
        run: npm test

  build-frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Code Quality (ESLint)
        working-directory: frontend
        run: npx eslint . --quiet

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Cloudflare Pages Redirects & Headers
        run: |
          test -f frontend/dist/_redirects || exit 1
          test -f frontend/dist/_headers || exit 1

  docker-validate:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

