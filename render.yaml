services:
  - type: web
    name: smartserve-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: smartserve-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://main.d36sahe4s27718.amplifyapp.com,https://d36sahe4s27718.amplifyapp.com,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://main.d36sahe4s27718.amplifyapp.com"

databases:
  - name: smartserve-postgres
    plan: free
    region: singapore
    databaseName: servicehub
    user: servicehub_user
