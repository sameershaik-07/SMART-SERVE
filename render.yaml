services:
  - type: web
    name: smartserve-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node scripts/init-db.js && npx prisma db push --accept-data-loss && node prisma/seed.js && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: smartserve-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://main.d36sahe4s27718.amplifyapp.com,https://d36sahe4s27718.amplifyapp.com,http://localhost:5173"
      - key: FRONTEND_URL
        value: "https://main.d36sahe4s27718.amplifyapp.com"
      - key: AWS_REGION
        value: "ap-south-1"
      - key: COGNITO_USER_POOL_ID
        value: "ap-south-1_oOR4o9c8Q"
      - key: COGNITO_CLIENT_ID
        value: "6bac6qkhu0opj6drp3fa26sv5a"
      - key: COGNITO_RESET_ENABLED
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: smartserve-postgres
    plan: free
    region: singapore
    databaseName: servicehub
    user: servicehub_user

